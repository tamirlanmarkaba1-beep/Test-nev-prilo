<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bliss</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#080d0d; --s1:#101817; --s2:#161f1e; --s3:#1d2827; --s4:#253332;
  --ol:#3b4c4a; --olv:#273533;
  --tx:#dce5e3; --tx2:#a4b5b2; --tx3:#6f807d;
  --pr:#5fc7b9; --onpr:#00201c; --prc:#0e4b45; --onprc:#a7f0e6;
  --sc:#26403d; --onsc:#c5e8e3; --soft:#8fc4bd; --er:#eba8a0;
  --r-s:12px; --r-m:16px; --r-l:20px; --r-xl:28px;
  --nw:152px; --tlh:232px;
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--ol) transparent;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Nunito',system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
body{height:100dvh;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button,input,select{font-family:inherit;touch-action:manipulation}
.hidden{display:none!important}
.grow{flex:1}
.ic{display:block;flex:none}
.screen{position:absolute;inset:0}

/* buttons */
.btn{height:40px;padding:0 20px;border-radius:999px;border:0;font:700 14px 'Nunito',sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--tx);background:transparent;white-space:nowrap;transition:filter .15s,background .15s}
.btn.fill{background:var(--pr);color:var(--onpr)}
.btn.tonal{background:var(--sc);color:var(--onsc)}
.btn.text{color:var(--pr);padding:0 14px}
.btn.sm{height:36px;padding:0 14px}
.btn.danger{color:var(--er)}
.btn:hover{filter:brightness(1.12)}
.btn.text:hover{background:rgba(95,199,185,.1);filter:none}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--tx2);display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s}
.ib:hover{background:rgba(220,229,227,.08)}
.ib.on{background:var(--prc);color:var(--onprc)}
.ib.sm{width:34px;height:34px}
.chip{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--ol);background:transparent;color:var(--tx2);font:700 13px 'Nunito',sans-serif;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;flex:none}
.chip.on{background:var(--sc);color:var(--onsc);border-color:transparent}

/* fields */
.tf{height:40px;border-radius:12px;border:1px solid transparent;background:var(--s3);color:var(--tx);padding:0 12px;font:600 14px 'Nunito',sans-serif;outline:0;width:100%;user-select:text;-webkit-user-select:text}
.tf:focus{border-color:var(--pr)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* home */
#home{overflow:auto;background:var(--bg)}
.deco{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.deco svg{position:absolute}
.home-in{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:28px 24px 72px}
.brand{display:flex;align-items:center;gap:12px}
.brand-t{font-weight:800;font-size:28px;letter-spacing:-.02em}
.brand svg.logo{width:44px;height:44px}
h1{font-size:clamp(34px,6vw,56px);line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:44px 0 14px}
.lead{max-width:520px;color:var(--tx2);font-size:17px;line-height:1.5;margin:0 0 32px;font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:760px}
.act{border:0;border-radius:var(--r-xl);padding:22px;display:flex;gap:16px;align-items:center;text-align:left;cursor:pointer;font-family:inherit;transition:transform .15s,filter .15s}
.act:hover{filter:brightness(1.1);transform:translateY(-2px)}
.act b{display:block;font-size:18px;font-weight:800}
.act small{display:block;margin-top:2px;font-size:13px;font-weight:600;opacity:.8}
.act.a{background:var(--prc);color:var(--onprc)}
.act.b{background:var(--sc);color:var(--onsc)}
.bubble{position:relative;width:64px;height:64px;flex:none}
.bubble svg.bg{position:absolute;inset:0;width:100%;height:100%}
.bubble .ic{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.act.a .bubble{color:var(--onpr)} .act.a .bubble .bg path{fill:var(--pr)}
.act.b .bubble{color:#0d2421} .act.b .bubble .bg path{fill:var(--soft)}
.sec{display:flex;align-items:baseline;gap:12px;margin:48px 0 16px}
.sec h2{margin:0;font-size:22px;font-weight:800}
.sec span{color:var(--tx3);font-weight:700;font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pcard{background:var(--s2);border-radius:var(--r-xl);padding:10px 10px 8px;cursor:pointer;transition:background .15s,transform .15s}
.pcard:hover{background:var(--s3);transform:translateY(-2px)}
.pth{aspect-ratio:16/10;border-radius:var(--r-l);background:var(--s1);overflow:hidden;display:grid;place-items:center;color:var(--tx3)}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pmeta{display:flex;align-items:center;gap:6px;padding:10px 4px 0 10px}
.pmeta div{flex:1;min-width:0}
.pmeta b{display:block;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta small{color:var(--tx3);font-weight:600;font-size:12px}
.empty-home{border:2px dashed var(--olv);border-radius:var(--r-xl);padding:40px 20px;text-align:center;color:var(--tx3);font-weight:700;grid-column:1/-1}

/* editor layout */
#editor{display:grid;grid-template-rows:56px minmax(0,1fr) var(--tlh);grid-template-columns:minmax(0,1fr) 304px;background:var(--bg)}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--s1);position:relative;z-index:30}
.topbar svg.logo{width:30px;height:30px}
.pname{background:transparent;border:1px solid transparent;border-radius:12px;height:40px;padding:0 12px;color:var(--tx);font:800 16px 'Nunito',sans-serif;width:min(280px,40vw);outline:0;user-select:text;-webkit-user-select:text}
.pname:hover{background:var(--s3)} .pname:focus{background:var(--s3);border-color:var(--pr)}
.mw{position:relative}
.menu{position:absolute;top:46px;left:0;min-width:268px;background:var(--s3);border-radius:var(--r-m);padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.55)}
.menu.pop{position:fixed;z-index:95;min-width:240px;max-width:90vw;max-height:70vh;overflow:auto}
.mi{display:flex;align-items:center;gap:14px;width:100%;height:48px;border:0;background:transparent;color:var(--tx);padding:0 14px;border-radius:12px;font:700 14px 'Nunito',sans-serif;cursor:pointer;text-align:left}
.mi:hover{background:rgba(95,199,185,.12)}
.mi:disabled{opacity:.4;pointer-events:none}
.mi.dg,.mi.dg .ic{color:var(--er)}
.mi small{margin-left:auto;color:var(--tx3);font-weight:600;font-size:12px;display:flex}
.mi .ic{color:var(--pr)}
.mi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .div{height:1px;background:var(--olv);margin:6px 8px}
#viewport{position:relative;min-width:0;min-height:0;overflow:hidden;background:#0a1110}
#cv{display:block;width:100%;height:100%;outline:0;touch-action:none}
.vp-fab{position:absolute;left:12px;top:12px;background:rgba(29,40,39,.92)!important;color:var(--tx)}
.vp-hint{position:absolute;left:12px;bottom:12px;background:rgba(16,24,23,.85);color:var(--tx2);font-weight:700;font-size:12px;padding:8px 14px;border-radius:999px;pointer-events:none}
.rail{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:6px;background:rgba(16,24,23,.93);border-radius:26px;max-height:calc(100% - 20px);overflow:auto;scrollbar-width:none;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.rail::-webkit-scrollbar{display:none}
.rail button{width:58px;height:58px;border-radius:18px;border:0;background:transparent;color:var(--tx2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 10px 'Nunito',sans-serif;cursor:pointer;flex:none}
.rail button:hover{background:rgba(220,229,227,.07)}
.rail button.on{background:var(--prc);color:var(--onprc)}
.rail button.act{background:var(--sc);color:var(--onsc)}
.rail .sp{height:1px;background:var(--olv);margin:2px 10px;flex:none}
.axis{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:rgba(16,24,23,.93);padding:4px;border-radius:999px;z-index:5}
.axis span{font:700 11px 'Nunito',sans-serif;color:var(--tx3);padding:0 6px 0 12px}
.axis button{height:36px;min-width:46px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--tx2);font:800 13px 'Nunito',sans-serif;cursor:pointer}
.axis button.on{background:var(--sc);color:var(--onsc)}
#side{background:var(--s1);overflow:auto;padding:12px 12px 4px;min-height:0}
.card{background:var(--s2);border-radius:var(--r-l);padding:14px;margin-bottom:12px}
.ct{font-weight:800;font-size:14px;color:var(--tx2);margin:0 0 12px 2px}
.ctrow{display:flex;align-items:center;justify-content:space-between;margin:-6px -6px 6px 2px}
.ctrow .ct{margin:0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:0;border-radius:var(--r-m);background:var(--s3);color:var(--tx);height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font:700 12px 'Nunito',sans-serif;cursor:pointer;transition:background .15s}
.tile:hover{background:var(--sc);color:var(--onsc)}
.tile .ic{color:var(--pr)}
#objs{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
.orow{display:flex;align-items:center;gap:8px;height:44px;padding:0 2px 0 12px;border-radius:14px;cursor:pointer;color:var(--tx);flex:none}
.orow:hover{background:rgba(220,229,227,.06)}
.orow.sel{background:var(--prc);color:var(--onprc)}
.orow.ind{margin-left:22px}
.orow.fd{background:var(--s3);font-weight:800;padding-left:6px}
.orow.over{outline:2px solid var(--pr);outline-offset:-2px}
.orow .on{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow.fd .on{font-weight:800}
.orow>.ic{color:var(--soft)}
.orow.sel>.ic{color:var(--onprc)}
.orow .ib{color:inherit;opacity:.8}
.cnt{color:var(--tx3);font-size:12px;font-weight:700}
.chev{display:grid;place-items:center;width:24px;flex:none;transition:transform .15s;color:var(--tx2)}
.orow.open .chev,.row.open .chev{transform:rotate(90deg)}
.rootdrop{display:none;align-items:center;justify-content:center;height:40px;border:2px dashed var(--ol);border-radius:14px;color:var(--tx3);font-weight:700;font-size:12px;margin-top:4px}
#objs.dragging .rootdrop{display:flex}
.hint{color:var(--tx3);font-weight:600;font-size:13px;padding:6px 4px;line-height:1.4}
.fh,.frow{display:grid;grid-template-columns:58px repeat(3,minmax(0,1fr));gap:6px;align-items:center}
.fh{margin:12px 0 4px}
.fh i{font-style:normal;text-align:center;font-weight:800;font-size:11px;color:var(--c)}
.frow{margin-bottom:6px}
.frow span{font-weight:700;font-size:12px;color:var(--tx2)}
.frow input{height:36px;border-radius:10px;border:1px solid transparent;background:var(--s3);color:var(--tx);text-align:center;font:700 12px 'Nunito',sans-serif;outline:0;width:100%;min-width:0;padding:0 2px;user-select:text;-webkit-user-select:text}
.frow input:focus{border-color:var(--pr)}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.sw button{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;background:var(--c);outline:2px solid transparent;outline-offset:2px}
.sw button.on{outline-color:var(--pr)}
.pact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pact .btn{flex:1;justify-content:center;padding:0 10px}

/* режимы редактора */
.modebar{display:flex;align-items:center;gap:3px;margin-left:6px;background:var(--s2);padding:4px;border-radius:999px}
.modebar button{height:34px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--tx2);font:800 12px 'Nunito',sans-serif;cursor:pointer;white-space:nowrap}
.modebar button.on{background:var(--prc);color:var(--onprc)}
#paintColor{width:34px;height:34px;border:0;border-radius:50%;background:none;padding:2px;cursor:pointer}
.mc-note{color:var(--pr);font-size:12px;font-weight:800;padding:8px 4px}
@media(max-width:820px){.modebar{margin-left:0}.modebar button{padding:0 7px;font-size:10px}.topbar{gap:1px;padding:0 3px}.pname{width:20vw}}
/* timeline */
#tl{grid-column:1/-1;background:var(--s1);display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--olv)}
.tl-head{display:flex;align-items:center;gap:6px;padding:6px 10px;overflow-x:auto;flex:none;scrollbar-width:none}
.tl-head::-webkit-scrollbar{display:none}
.tl-head .sep{width:1px;height:24px;background:var(--olv);margin:0 4px;flex:none}
.tl-head .btn{flex:none}
#bAnim .an{max-width:120px;overflow:hidden;text-overflow:ellipsis}
.ib.pl{background:var(--pr);color:var(--onpr)}
.ib.pl:hover{background:var(--pr);filter:brightness(1.12)}
.fl{display:flex;align-items:center;gap:6px;color:var(--tx2);font-weight:700;font-size:13px;white-space:nowrap;flex:none}
.fl input{width:62px;height:36px;border-radius:10px;border:1px solid transparent;background:var(--s3);color:var(--tx);text-align:center;font:700 14px 'Nunito',sans-serif;outline:0;user-select:text;-webkit-user-select:text}
.fl input:focus{border-color:var(--pr)}
.tl-scroll{flex:1;overflow:auto;position:relative;min-height:0}
.tl-in{position:relative;min-height:100%}
.ruler{position:sticky;top:0;z-index:5;height:32px;display:flex;background:var(--s1);touch-action:none;cursor:pointer}
.rn{position:sticky;left:0;z-index:8;width:var(--nw);flex:none;background:var(--s1);display:flex;align-items:center;gap:8px;padding:0 12px;font-weight:700;font-size:13px;border-right:1px solid var(--olv);cursor:pointer;overflow:hidden;color:var(--tx)}
.rn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn .ic{color:var(--soft);flex:none}
.rn.ind{padding-left:26px}
.row.fold .rn{background:var(--s3);font-weight:800;padding-left:6px;gap:4px}
.row.fold .rt{background:var(--s2)}
.row.fold .chev{width:20px}
.ruler .rn{z-index:9;cursor:default}
.rt{position:relative;flex:none}
.tk{position:absolute;bottom:0;width:1px;height:5px;background:var(--olv)}
.tk.m{height:12px;background:var(--ol)}
.tkl{position:absolute;top:5px;font-weight:700;font-size:11px;color:var(--tx3);transform:translateX(4px);pointer-events:none}
.row{display:flex;height:40px;border-bottom:1px solid var(--olv)}
.row .rt{background-image:linear-gradient(90deg,var(--olv) 1px,transparent 1px)}
.row.fold .rt{background-image:none}
.row.sel .rn{background:var(--prc);color:var(--onprc)}
.row.sel .rn .ic{color:var(--onprc)}
.row.sel .rt{background-color:rgba(95,199,185,.07)}
.key{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:4px;transform:rotate(45deg);background:var(--soft);cursor:grab;touch-action:none;transition:background .1s}
.key::after{content:'';position:absolute;inset:-10px}
.key:hover{background:var(--onprc)}
.key.on{background:var(--pr);box-shadow:0 0 0 3px rgba(95,199,185,.3)}
.ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--pr);z-index:6;pointer-events:none}
.phh{position:sticky;top:4px;display:block;width:max-content;transform:translateX(calc(-50% + 1px));background:var(--pr);color:var(--onpr);font-weight:800;font-size:11px;padding:3px 8px;border-radius:999px}
.tl-empty{position:sticky;left:0;padding:18px;color:var(--tx3);font-weight:600;font-size:13px;width:max-content;max-width:90vw}

/* dialog + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:grid;place-items:center;padding:20px}
.dialog{background:var(--s3);border-radius:var(--r-xl);padding:24px;width:min(400px,100%)}
.dialog h2{margin:0 0 10px;font-size:22px;font-weight:800}
.dialog p{margin:0 0 16px;color:var(--tx2);font-weight:600;line-height:1.45;font-size:15px}
.dialog .tf{margin-bottom:6px;background:var(--s2)}
.dact{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--s4);color:var(--tx);padding:14px 22px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:120;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

#btnPanel{display:none}

/* touch */
@media (pointer:coarse){
  .ib{width:44px;height:44px}
  .ib.sm{width:40px;height:40px}
  .frow input,.fl input,.tf,.pname{font-size:16px}
  .frow input{height:42px}
  .orow{height:50px}
  .tile{height:74px}
  .rail button{width:62px;height:62px}
  .axis button{height:40px;min-width:50px}
  .row{height:44px}
  .mi{height:52px}
}
@media (max-width:820px){
  :root{--nw:104px;--tlh:214px}
  #editor{grid-template-columns:minmax(0,1fr)}
  #side{position:absolute;top:56px;left:0;bottom:var(--tlh);width:min(88vw,340px);z-index:20;transform:translateX(-105%);transition:transform .25s;box-shadow:10px 0 30px rgba(0,0,0,.5)}
  #side.open{transform:none}
  #btnPanel{display:grid}
  .vp-hint{display:none}
  .acts{grid-template-columns:1fr}
  .home-in{padding:20px 18px 60px}
  .pname{width:34vw}
  .rail{right:8px}
}
@media (max-height:600px){
  :root{--tlh:172px}
  .rail button{width:52px;height:46px;font-size:0;gap:0}
  .rail button span{display:none}
  .row{height:36px}
}
</style>
</head>
<body>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="home" class="screen">
  <div class="deco" id="deco" aria-hidden="true"></div>
  <div class="home-in">
    <div class="brand"><span data-logo></span><span class="brand-t">bliss</span></div>
    <h1>Анимируй<br>в трёх измерениях</h1>
    <p class="lead">Простая студия 3D-анимации с ключевыми кадрами. Создайте проект или продолжите начатый.</p>
    <div class="acts">
      <button class="act a" id="actNew"><span class="bubble" data-bubble="plus"></span><span><b>Создать проект</b><small>Пустая сцена с сеткой</small></span></button>
      <button class="act b" id="actImp"><span class="bubble" data-bubble="import"></span><span><b>Открыть модель</b><small>Импорт .glb или .gltf</small></span></button>
    </div>
    <div class="sec"><h2>Ваши проекты</h2><span id="projCount"></span></div>
    <div class="pgrid" id="projGrid"></div>
  </div>
</div>

<!-- РЕДАКТОР -->
<div id="editor" class="screen hidden">
  <header class="topbar">
    <button class="ib" id="btnHome" title="Все проекты"><span data-logo></span></button>
    <div class="mw">
      <button class="btn text" id="btnFile" data-ic="file" data-s="20">Файл</button>
      <div class="menu hidden" id="fileMenu">
        <button class="mi" data-act="new" data-ic="plus">Новый проект</button>
        <button class="mi" data-act="save" data-ic="save">Сохранить<small>Ctrl+S</small></button>
        <div class="div"></div>
        <button class="mi" data-act="import" data-ic="import">Импорт модели<small>.glb .gltf .json</small></button>
        <button class="mi" data-act="export" data-ic="export">Экспорт модели<small>.glb с анимациями</small></button>
        <div class="div"></div>
        <button class="mi" data-act="home" data-ic="home">Все проекты</button>
      </div>
    </div>
    <input id="projName" class="pname" maxlength="40" spellcheck="false" aria-label="Название проекта">

/* ---------- IndexedDB / Хранилище ---------- */
let _db=null;const mem=new Map();
function dbo(){if(!_db)_db=new Promise((res,rej)=>{try{const r=indexedDB.open('bliss-projects',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return _db}
const tx=(db,mode)=>db.transaction('p',mode).objectStore('p');
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function dbAll(){try{return await rq(tx(await dbo(),'readonly').getAll())}catch(e){return [...mem.values()]}}
async function dbGet(id){try{return await rq(tx(await dbo(),'readonly').get(id))}catch(e){return mem.get(id)}}
async function dbPut(rec){try{await rq(tx(await dbo(),'readwrite').put(rec))}catch(e){mem.set(rec.id,rec)}}
async function dbDel(id){try{await rq(tx(await dbo(),'readwrite').delete(id))}catch(e){mem.delete(id)}}

function dlg({title,text='',input,ok='ОК',cancel='Отмена'}){
  return new Promise(res=>{
    const sc=$('#scrim'),di=$('#dI');
    $('#dT').textContent=title;$('#dX').textContent=text;$('#dX').classList.toggle('hidden',!text);
    di.classList.toggle('hidden',input===undefined);if(input!==undefined)di.value=input;
    $('#dK').textContent=ok;$('#dC').textContent=cancel;sc.classList.remove('hidden');
    if(input!==undefined)setTimeout(()=>{di.focus();di.select()},30);
    const fin=v=>{sc.classList.add('hidden');$('#dK').onclick=$('#dC').onclick=sc.onclick=di.onkeydown=null;res(v)};
    $('#dK').onclick=()=>fin(input!==undefined?(di.value.trim()||'Без названия'):true);
    $('#dC').onclick=()=>fin(null);
    sc.onclick=e=>{if(e.target===sc)fin(null)};
    di.onkeydown=e=>{if(e.key==='Enter')$('#dK').click();if(e.key==='Escape')fin(null)};
  });
}

  document.body.appendChild(m);popEl=m;popT=performance.now();

  tc=new THREE.TransformControls(cam,cv);tc.setSize(coarse?1.35:.85);scene.add(tc);
  tc.addEventListener('dragging-changed',e=>{if(orbit)orbit.enabled=!e.value;if(!e.value)onTransformEnd()});
  tc.addEventListener('objectChange',()=>refreshFields());

  const rc=new THREE.Raycaster(),v2=new THREE.Vector2(),pl=new THREE.Plane(),tmp=new THREE.Vector3();
  function ndcRay(e){const r=cv.getBoundingClientRect();v2.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);rc.setFromCamera(v2,cam);return rc.ray}
  function hitObj(e){
    ndcRay(e);
    const hits=rc.intersectObjects(state.objs.filter(isVis).map(o=>o.root),true);
    if(!hits.length)return null;
    let t=hits[0].object;while(t&&t!==world){const found=state.objs.find(o=>o.root===t);if(found)return found;t=t.parent}return null;
  }
  let down=null,dd=null;
  cv.addEventListener('pointerdown',e=>{
    if(innerWidth<=820)$('#side').classList.remove('open');
    if(!e.isPrimary){down=null;endDD(true);return}
    down={x:e.clientX,y:e.clientY,hit:!!tc.axis||tc.dragging};
    if(down.hit||(e.pointerType==='mouse'&&e.button!==0))return;
    const o=hitObj(e);if(!o)return;
    if(state.work==='paint'){setColor(o,state.paint);return}
    if(state.sel!==o)select(o);
    startDD(e,o);
  });
  cv.addEventListener('pointerup',e=>{
    if(!down)return;const d=down;down=null;
    if(d.hit||Math.hypot(e.clientX-d.x,e.clientY-d.y)>5)return;
    const o=hitObj(e);select(o);
  });
  function startDD(e,o){
    pause();
    const root=o.root,ray=ndcRay(e);
    dd={o,sx:e.clientX,sy:e.clientY,q0:root.quaternion.clone(),s0:root.scale.clone(),off:new THREE.Vector3(),moved:false,id:e.pointerId};
    if(state.mode==='translate'){
      if(state.axis==='y'){
        const n=new THREE.Vector3(cam.position.x-root.position.x,0,cam.position.z-root.position.z);
        if(n.lengthSq()<1e-6)n.set(0,0,1);n.normalize();pl.setFromNormalAndCoplanarPoint(n,root.position);
      }else pl.set(new THREE.Vector3(0,1,0),-root.position.y);
      if(ray.intersectPlane(pl,tmp))dd.off.copy(root.position).sub(tmp);
    }
    if(orbit)orbit.enabled=false;
    addEventListener('pointermove',ddMove);addEventListener('pointerup',ddUp);addEventListener('pointercancel',ddUp);
  }
  function ddMove(e){
    if(!dd||e.pointerId!==dd.id)return;
    const dx=e.clientX-dd.sx,dy=e.clientY-dd.sy;
    if(!dd.moved&&Math.hypot(dx,dy)<4)return;
    dd.moved=true;
    const root=dd.o.root,ax=state.axis;
    if(state.mode==='translate'){
      if(ndcRay(e).intersectPlane(pl,tmp)){
        tmp.add(dd.off);
        if(state.mc){
          const step=1/state.pixels;
          if(ax==='free'){root.position.x=Math.round(tmp.x/step)*step;root.position.z=Math.round(tmp.z/step)*step}
          else if(ax==='x')root.position.x=Math.round(tmp.x/step)*step;
          else if(ax==='z')root.position.z=Math.round(tmp.z/step)*step;
          else root.position.y=Math.round(tmp.y/step)*step;
        }else{
          if(ax==='free'){root.position.x=clamp(tmp.x,-200,200);root.position.z=clamp(tmp.z,-200,200)}
          else if(ax==='x')root.position.x=clamp(tmp.x,-200,200);
          else if(ax==='z')root.position.z=clamp(tmp.z,-200,200);
          else root.position.y=clamp(tmp.y,-200,200);
        }
      }
    }else if(state.mode==='rotate'){
      const axis=new THREE.Vector3(ax==='x'?1:0,(ax==='free'||ax==='y')?1:0,ax==='z'?1:0);
      let ang=(ax==='x'?dy:dx)*.012;
      if(state.mc)ang=Math.round(ang/(Math.PI/8))*(Math.PI/8); // Квантование углов по 22.5° как в Blockbench
      root.quaternion.copy(dd.q0).premultiply(new THREE.Quaternion().setFromAxisAngle(axis,ang));
    }else{
      const f=Math.exp(-dy*.006);
      if(state.mc){
        const step=1/state.pixels;
        ['x','y','z'].forEach(k=>{if(ax==='free'||ax===k){const cur=Math.max(step,Math.round(root.scale[k]/step)*step*f);root.scale[k]=Math.max(step,cur)}});
      }else{
        if(ax==='free'){root.scale.copy(dd.s0).multiplyScalar(f);['x','y','z'].forEach(k=>{if(root.scale[k]<.01)root.scale[k]=.01})}
        else{root.scale.copy(dd.s0);root.scale[ax]=Math.max(.01,dd.s0[ax]*f)}
      }
    }
    refreshFields();
  }
  function ddUp(){endDD(true)}
  function endDD(commit){
    if(!dd)return;
    removeEventListener('pointermove',ddMove);removeEventListener('pointerup',ddUp);removeEventListener('pointercancel',ddUp);
    const m=dd.moved;dd=null;if(orbit)orbit.enabled=true;
    if(commit&&m)onTransformEnd();
  }

  orbit=new THREE.OrbitControls(cam,cv);orbit.enableDamping=true;orbit.dampingFactor=.08;orbit.target.set(0,.8,0);
  orbit.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};
  box=new THREE.BoxHelper(new THREE.Object3D(),0x7fd6ca);box.visible=false;scene.add(box);
  new ResizeObserver(resize).observe(vp);

  let last=performance.now();
  (function loop(t){
    requestAnimationFrame(loop);
    const dt=Math.min(.1,(t-last)/1000);last=t;
    if(!editorOn||exporting)return;
    if(state.playing){
      let n=state.cur+dt*state.fps;
      if(n>=state.end){if(state.loop)n=0;else{n=state.end;pause()}}
      setTime(n);
    }
    orbit.update();if(box.visible&&state.sel)box.update();
    R.render(scene,cam);
  })(last);
}
function resize(){
  if(!R)return;const vp=$('#viewport'),w=vp.clientWidth,h=vp.clientHeight;if(!w||!h)return;
  R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
}

function setMode(m){state.mode=m;tc.setMode(m);$$('#rail [data-m]').forEach(x=>x.classList.toggle('on',x.dataset.m===m))}

/* ---------- Создание объектов и вокселей Minecraft ---------- */
function makeObj(root,name,kind){
  root.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true}});
  const o={uid:++uidc,name,kind,root,tracks:{},keys:null,vis:true,folder:null,base:null};
  o.tracks[state.anim]=o.keys=[];captureBase(o);
  world.add(root);state.objs.push(o);return o;
}
function addShape(kind){
  const mat=new THREE.MeshStandardMaterial({color:0xd9e8e5,roughness:.55,metalness:.05,side:kind==='plane'?THREE.DoubleSide:THREE.FrontSide});
  let geom;
  if(state.mc||kind==='block'){
    const step=1/state.pixels;
    geom=new THREE.BoxGeometry(step*16,step*16,step*16); // Воксельный куб размером с полноценный пиксельный блок
  }else{
    const G={cube:()=>new THREE.BoxGeometry(1,1,1),sphere:()=>new THREE.SphereGeometry(.6,48,32),cylinder:()=>new THREE.CylinderGeometry(.5,.5,1.2,48),cone:()=>new THREE.ConeGeometry(.6,1.2,48),torus:()=>new THREE.TorusGeometry(.5,.2,24,64),plane:()=>new THREE.PlaneGeometry(1.8,1.8)};
    geom=G[kind]();
  }
  const m=new THREE.Mesh(geom,mat);
  const n=state.objs.filter(o=>o.kind===kind).length+1,c=state.objs.length;
  const lift=state.mc?0.5:{cube:.5,block:.5,sphere:.6,cylinder:.6,cone:.6,torus:.7,plane:.01}[kind];
  if(state.mc){
    const step=1/state.pixels;
    m.position.set(0,lift,0);
  }else{
    m.position.set(((c%5)-2)*1.5,lift,0);
    if(kind==='plane')m.rotation.x=-Math.PI/2;
  }
  const o=makeObj(m,`${KINDS[state.mc?'block':kind]} ${n}`,state.mc?'block':kind);
  renderAll();select(o);markDirty();
  if(innerWidth<=820)$('#side').classList.remove('open');
}
function isDescendant(candidate,parent){let p=candidate.root.parent;while(p&&p!==world){if(p===parent.root)return true;p=p.parent}return false}
function attachObject(o,parent){
  if(o===parent||isDescendant(parent,o)){toast('Нельзя создать цикл в иерархии');return}
  parent.root.attach(o.root);o.parentUid=parent.uid;renderObjs();markDirty();toast('Прикреплено к '+parent.name);
}
function detachObject(o){if(!o.root.parent||o.root.parent===world){toast('Объект уже самостоятельный');return}world.attach(o.root);o.parentUid=null;renderObjs();markDirty();toast('Отсодинено')}
function removeObj(o){
  if(state.sel===o)select(null);
  state.objs.filter(x=>x.root.parent===o.root).forEach(x=>{world.attach(x.root);x.parentUid=null});
  world.remove(o.root);state.objs=state.objs.filter(x=>x!==o);
  if(state.selKey&&Object.values(o.tracks).some(t=>t.includes(state.selKey)))state.selKey=null;
  renderAll();markDirty();
}
function duplicate(o){
  const c=o.root.clone(true);
  c.traverse(m=>{if(m.isMesh&&m.material){m.material=m.material.clone()}});
  const off=[.6,0,.6];c.position.x+=off[0];c.position.z+=off[2];
  const n=makeObj(c,o.name+' копия',o.kind);
  n.tracks={};
  state.anims.forEach(a=>{n.tracks[a.id]=(o.tracks[a.id]||[]).map(k=>({f:k.f,p:[k.p[0]+off[0],k.p[1],k.p[2]+off[2]],q:k.q.slice(),s:k.s.slice()}))});
  n.keys=n.tracks[state.anim];n.folder=o.folder;applyVis(n);
  renderAll();select(n);markDirty();
}
function setColor(o,hex){
  o.root.traverse(m=>{if(m.isMesh){if(!m.material.userData.own){m.material=m.material.clone();m.material.userData.own=true}m.material.color.set(hex)}});
  markDirty();
}
function select(o){
  state.sel=o||null;
  if(o&&isVis(o)){tc.attach(o.root);box.setFromObject(o.root);box.visible=true}else{tc.detach();box.visible=false}
  $('#axisBar').classList.toggle('hidden',!o);

}
function onTransformEnd(){
  const o=state.sel;refreshFields();
  if(o&&!o.keys.length)captureBase(o);
  if(state.auto)autoKey();

function newFolder(name){const f={id:'f'+(++fidc),name,open:true,vis:true};state.folders.push(f);return f}
function moveToFolder(o,fid){
  o.folder=fid||null;const f=folderOf(o);if(f)f.open=true;

/* ---------- Анимации и таймлайн ---------- */
const _q1=new THREE.Quaternion(),_q2=new THREE.Quaternion();
function sample(K,f){
  let a,b,t=0;
  if(f<=K[0].f)a=b=K[0];
  else if(f>=K[K.length-1].f)a=b=K[K.length-1];
  else{let i=0;while(K[i+1].f<=f)i++;a=K[i];b=K[i+1];t=(f-a.f)/(b.f-a.f);if(state.smooth)t=t*t*(3-2*t)}
  if(a===b)return{p:a.p,q:a.q,s:a.s};
  const L=(x,y)=>x.map((v,i)=>v+(y[i]-v)*t);
  _q1.fromArray(a.q);_q2.fromArray(b.q);_q1.slerp(_q2,t);
  return{p:L(a.p,b.p),q:_q1.toArray(),s:L(a.s,b.s)};
}
function applyTime(f){
  state.objs.forEach(o=>{
    if(o.keys.length){const s=sample(o.keys,f);o.root.position.fromArray(s.p);o.root.quaternion.fromArray(s.q);o.root.scale.fromArray(s.s)}
    if(o.mixer)o.mixer.setTime(f/state.fps);
  });
}
function addKey(o,f){
  let k=o.keys.find(x=>x.f===f);
  const data={p:o.root.position.toArray(),q:o.root.quaternion.toArray(),s:o.root.scale.toArray()};
  if(k)Object.assign(k,data);else{k={f,...data};o.keys.push(k);o.keys.sort((a,b)=>a.f-b.f)}
  state.selKey=k;markDirty();return k;
}
function keyHere(){
  if(!state.sel){toast('Выберите объект');return}
  addKey(state.sel,Math.round(state.cur));renderTL();
}
function autoKey(){if(state.auto&&state.sel&&!state.playing){addKey(state.sel,Math.round(state.cur));renderTL()}}
function deleteKey(){
  const k=state.selKey;if(!k)return false;
  const o=state.objs.find(x=>x.keys.includes(k));if(!o)return false;
  o.keys.splice(o.keys.indexOf(k),1);state.selKey=null;
  if(!o.keys.length)captureBase(o);
  renderTL();applyTime(state.cur);markDirty();return true;
}
function setTime(f){state.cur=clamp(f,0,state.end);applyTime(state.cur);updatePH();refreshFields()}

const fmt=v=>String(+v.toFixed(2));
function renderProps(){

  if(!o){el.innerHTML='<div class="ct">Свойства</div><div class="hint">Выберите объект для точной настройки вокселей и позиционирования.</div>';return}
  const row=(l,f,st)=>`<div class="frow"><span>${l}</span>${[0,1,2].map(a=>`<input type="number" step="${st}" inputmode="decimal" data-f="${f}" data-a="${a}">`).join('')}</div>`;
  el.innerHTML=`<div class="ct">Свойства</div><input class="tf" id="pName" value="${esc(o.name)}" maxlength="32" spellcheck="false">

function renderTL(){
  const W=PAD*2+state.end*state.ppf,pp=state.ppf;
  const steps=[1,2,5,10,20,50,100,200];const step=steps.find(s=>s*pp>=46)||500;
  let t='';
  for(let f=0;f<=state.end;f++){
    const major=f%step===0;
    if(major)t+=`<div class="tk m" style="left:${PAD+f*pp}px"></div><div class="tkl" style="left:${PAD+f*pp}px">${f}</div>`;
    else if(pp>=7)t+=`<div class="tk" style="left:${PAD+f*pp}px"></div>`;
  }
  const bg=`background-size:${pp*5}px 100%;background-position:${PAD}px 0`;
  let h=`<div style="width:${NW+W}px"><div class="ruler"><div class="rn"></div><div class="rt" id="ruler" style="width:${W}px">${t}</div></div>`;
  h+=orderItems().map(it=>{
    if(it.f){const f=it.f;return `<div class="row fold${f.open?' open':''}" data-f="${f.id}"><div class="rn"><i class="chev">${ic('chevron',16)}</i>${ic('folder',16)}<span>${esc(f.name)}</span></div><div class="rt" style="width:${W}px"></div></div>`}
    const o=it.o;
    return `<div class="row${o===state.sel?' sel':''}" data-u="${o.uid}"><div class="rn${it.ind?' ind':''}">${ic(iconOf(o.kind),16)}<span>${esc(o.name)}</span></div><div class="rt" style="width:${W}px;${bg}">${o.keys.map((k,i)=>`<div class="key${k===state.selKey?' on':''}" data-u="${o.uid}" data-i="${i}" style="left:${PAD+k.f*pp}px"></div>`).join('')}</div></div>`;
  }).join('');
  if(!state.objs.length)h+='<div class="tl-empty">Добавьте объект и поставьте ключевой кадр.</div>';
  h+='</div><div class="ph" id="ph"><span class="phh">0</span></div>';
  $('#tlIn').innerHTML=h;updatePH();
}

/* ---------- Импорт / Экспорт ---------- */
const parseGLB=data=>new Promise((res,rej)=>new THREE.GLTFLoader().parse(data,'',res,rej));
const cloneKeys=a=>(a||[]).map(k=>({f:k.f,p:k.p,q:k.q,s:k.s}));
function importGltf(gltf,name,asProject){
  const sc=gltf.scene,meta=sc.userData&&sc.userData.bliss;
  if(meta){
    const anims=(meta.anims&&meta.anims.length)?meta.anims:[{id:'a1',name:'Анимация 1',end:meta.end||120}];
    const curId=(meta.cur&&anims.some(a=>a.id===meta.cur))?meta.cur:anims[0].id;
    if(asProject){
      state.fps=meta.fps||24;state.smooth=!!meta.ease;
      $('#bEase').classList.toggle('on',state.smooth);$('#bEase').textContent=state.smooth?'Плавно':'Линейно';
      state.anims=anims.map(a=>({id:a.id,name:a.name,end:a.end||120}));state.anim=curId;
      animc=Math.max(1,...state.anims.map(a=>parseInt(String(a.id).slice(1))||1));
      state.folders=(meta.folders||[]).map(f=>({id:f.id,name:f.name,open:f.open!==false,vis:f.vis!==false}));
      fidc=Math.max(0,...state.folders.map(f=>parseInt(String(f.id).slice(1))||0));
      state.end=curAnim().end;$('#endIn').value=state.end;
    }else{
      const srcA=anims.find(a=>a.id===curId);
      state.end=Math.max(state.end,srcA.end||120);curAnim().end=state.end;$('#endIn').value=state.end;
    }
    const importedByIndex=[],modelNodes=[];
    sc.traverse(ch=>{if(/^o(\d+)_/.test(ch.name))modelNodes.push(ch)});
    modelNodes.forEach(ch=>{
      const m=/^o(\d+)_/.exec(ch.name);
      const mo=meta.objs&&meta.objs[+m[1]];
      const o=makeObj(ch,mo?mo.name:(ch.userData.label||ch.name||'Объект'),mo?mo.kind:(ch.userData.kind||'model'));
      if(mo)importedByIndex[+m[1]]=o;
      if(!mo)return;
      const tr=mo.tracks||{[anims[0].id]:mo.keys||[]};
      if(asProject){
        anims.forEach(a=>{o.tracks[a.id]=cloneKeys(tr[a.id])});
        o.keys=o.tracks[state.anim];
        o.folder=(mo.folder&&state.folders.some(f=>f.id===mo.folder))?mo.folder:null;
      }else o.keys.push(...cloneKeys(tr[curId]));
      o.vis=mo.vis!==false;
    });
    (meta.objs||[]).forEach((mo,i)=>{const child=importedByIndex[i],parent=mo.parent>=0?importedByIndex[mo.parent]:null;if(child&&parent){parent.root.attach(child.root);child.parentUid=parent.uid}});
    state.objs.forEach(applyVis);
    return;
  }
  const g=new THREE.Group();[...sc.children].forEach(c=>g.add(c));
  const bb=new THREE.Box3().setFromObject(g),sz=bb.getSize(new THREE.Vector3()),mx=Math.max(sz.x,sz.y,sz.z)||1;
  if(mx>6||mx<.3)g.scale.setScalar(2.5/mx);
  g.updateMatrixWorld(true);
  const b2=new THREE.Box3().setFromObject(g),c=b2.getCenter(new THREE.Vector3());
  g.position.set(-c.x,-b2.min.y,-c.z);
  makeObj(g,(name||'Модель').slice(0,28),'model');
}
async function importFile(file,asNewProject){
  try{
    if(/\.json$/i.test(file.name)){const data=JSON.parse(await file.text());if(asNewProject)await createProject(file.name.replace(/\.json$/i,''),true,16);toast('JSON импортирован');return}
    const isGltf=/\.gltf$/i.test(file.name);
    const data=isGltf?await file.text():await file.arrayBuffer();
    const base=file.name.replace(/\.[^.]+$/,'');
    if(asNewProject)await createProject(base);
    const g=await parseGLB(data);
    importGltf(g,base,asNewProject&&!!(g.scene.userData&&g.scene.userData.bliss));
    updateAnimBtn();renderAll();setTime(state.cur);markDirty();
    if(state.objs.length)select(state.objs[state.objs.length-1]);
    toast('Модель загружена');
  }catch(e){toast('Не удалось открыть файл')}
}
function bakeTrack(K){
  const fr=[];
  for(let i=0;i<K.length;i++){
    fr.push(K[i].f);
    if(state.smooth&&i<K.length-1){const g=K[i+1].f-K[i].f,n=Math.min(8,g*2);for(let j=1;j<=n;j++)fr.push(K[i].f+g*j/(n+1))}
  }
  const P3=[],Q4=[],S3=[];
  fr.forEach(f=>{const s=sample(K,f);P3.push(...s.p);Q4.push(...s.q);S3.push(...s.s)});
  return{times:fr.map(f=>f/state.fps),P3,Q4,S3};
}
function exportGLB(){
  return new Promise((res,rej)=>{
    exporting=true;
    const prevSel=state.sel;tc.detach();box.visible=false;
    const saved=state.objs.map(o=>({n:o.root.name,u:o.root.userData,p:o.root.position.toArray(),q:o.root.quaternion.toArray(),s:o.root.scale.toArray()}));
    const sc=new THREE.Scene();sc.name='Bliss';
    const names=state.objs.map((o,i)=>'o'+i+'_'+(o.name.replace(/[^A-Za-z0-9]/g,'')||'obj'));
    const meta={fps:state.fps,ease:state.smooth?1:0,cur:state.anim,
      anims:state.anims.map(a=>({id:a.id,name:a.name,end:a.end})),
      folders:state.folders.map(f=>({id:f.id,name:f.name,open:f.open,vis:f.vis})),objs:[]};
    state.objs.forEach((o,i)=>{
      o.root.name=names[i];o.root.userData={label:o.name,kind:o.kind};
      restoreBase(o);
      const tr={};state.anims.forEach(a=>{tr[a.id]=cloneKeys(o.tracks[a.id])});
      meta.objs.push({name:o.name,kind:o.kind,vis:o.vis,folder:o.folder||null,parent:o.parentUid?state.objs.findIndex(x=>x.uid===o.parentUid):-1,tracks:tr});
      if(!o.parentUid)sc.add(o.root);
    });
    const clips=[];
    state.anims.forEach(a=>{
      const tracks=[];
      state.objs.forEach((o,i)=>{
        const K=o.tracks[a.id];
        if(K&&K.length){const b=bakeTrack(K);tracks.push(new THREE.VectorKeyframeTrack(names[i]+'.position',b.times,b.P3),new THREE.QuaternionKeyframeTrack(names[i]+'.quaternion',b.times,b.Q4),new THREE.VectorKeyframeTrack(names[i]+'.scale',b.times,b.S3))}
      });
      if(tracks.length)clips.push(new THREE.AnimationClip(a.name,-1,tracks));
    });
    sc.userData={bliss:meta};
    const done=()=>{
      state.objs.forEach((o,i)=>{const s=saved[i];o.root.name=s.n;o.root.userData=s.u;o.root.position.fromArray(s.p);o.root.quaternion.fromArray(s.q);o.root.scale.fromArray(s.s);if(!o.parentUid)world.add(o.root)});
      exporting=false;if(prevSel&&state.objs.includes(prevSel))select(prevSel);
    };
    try{
      const opts={binary:true,trs:true,onlyVisible:false};
      if(clips.length)opts.animations=clips;
      new THREE.GLTFExporter().parse(sc,glb=>{done();res(glb)},opts);
    }catch(e){done();rej(e)}
  });
}
async function exportFile(){
  try{
    const buf=await exportGLB();
    const url=URL.createObjectURL(new Blob([buf],{type:'model/gltf-binary'}));
    const a=document.createElement('a');a.href=url;a.download=(state.name||'bliss').replace(/[\\/:*?"<>|]/g,'_')+'.glb';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    toast('Экспортировано');
  }catch(e){toast('Ошибка экспорта')}
}
function thumb(){

$('#bKey').onclick=keyHere;
$('#bDelKey').onclick=()=>{if(!deleteKey())toast('Выберите ключ')};
$('#frameIn').onchange=e=>{pause();setTime(parseInt(e.target.value)||0)};
$('#endIn').onchange=e=>{state.end=clamp(parseInt(e.target.value)||120,1,1200);curAnim().end=state.end;e.target.value=state.end;if(state.cur>state.end)setTime(state.end);renderTL();markDirty()};
const zoom=m=>{state.ppf=clamp(state.ppf*m,3,40);renderTL()};
$('#bZin').onclick=()=>zoom(1.3);$('#bZout').onclick=()=>zoom(1/1.3);

/* Клавиатура */
document.addEventListener('keydown',e=>{
  if(!editorOn||!$('#scrim').classList.contains('hidden'))return;
  const t=e.target.tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='s'){e.preventDefault();saveProject(false);return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(k===' '){e.preventDefault();state.playing?pause():play()}
  else if(k==='g')setMode('translate');
  else if(k==='r')setMode('rotate');
  else if(k==='s')setMode('scale');
  else if(k==='i')keyHere();
  else if(k==='d'&&e.shiftKey&&state.sel)duplicate(state.sel);
  else if(k==='delete'||k==='backspace'||k==='x'){if(!deleteKey()&&state.sel)removeObj(state.sel)}
  else if(k==='arrowright'){pause();setTime(Math.round(state.cur)+1)}
  else if(k==='arrowleft'){pause();setTime(Math.round(state.cur)-1)}
  else if(k==='home'){pause();setTime(0)}
  else if(k==='escape'){closePop();select(null)}
});
addEventListener('resize',()=>{setNW();resize();if(editorOn)renderTL()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&editorOn&&state.id)saveProject(true)});

/* Старт */
hydrate(document);
setPlayIcon('play');
initDecor();setNW();renderHome();
})();
</script>
</body>
</html>
